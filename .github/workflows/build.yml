name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o offline_bluetooth_chat*.zip -d .
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Android v1 Embedding Issue
        run: |
          # Android v1 embedding စစ်ဆေးမှုကို ကျော်လွှားရန် config ထည့်သွင်းခြင်း
          echo "flutter.suppress-android-v1-deprecation-warning=true" >> android/gradle.properties || true
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties || true
          
          # Manifest ထဲမှ v1 application tag အဟောင်းကို ရှင်းလင်းခြင်း
          sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="android.app.Application"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-validate-approvals

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireChat-Myanmar-Release
          path: build/app/outputs/flutter-apk/app-release.apk

