name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o offline_bluetooth_chat*.zip -d .
          ls -la

      - name: Fix Android v1 Embedding
        run: |
          # AndroidManifest.xml ထဲမှ flutterEmbedding v1 tag အား ရှင်းလင်းပြီး v2 သို့ ပြောင်းလဲခြင်း
          find android -name "AndroidManifest.xml" -exec sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="android.app.Application"/g' {} +
          find android -name "AndroidManifest.xml" -exec sed -i '/android:name="flutterEmbedding"/d' {} +
          find android -name "AndroidManifest.xml" -exec sed -i '/<application/a \        <meta-data android:name="flutterEmbedding" android:value="2" \/>' {} +

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireChat-Myanmar-Release
          path: build/app/outputs/flutter-apk/app-release.apk

